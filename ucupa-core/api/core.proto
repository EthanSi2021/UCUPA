message ReleaseObserveRequest { oneof context { ucupa.network.Token preparation = 1 [(ucupa.network.token_kind) = OBSERVATION_PREPARATION]; ucupa.network.Token cursor = 2 [(ucupa.network.token_kind) = OBSERVATION_CURSOR]; } }

