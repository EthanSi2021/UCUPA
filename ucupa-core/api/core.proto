  optional ReadMode read_mode = 2 [(ucupa.network.required_value) = true];
  optional Presence state = 3 [(ucupa.network.required_value) = true];
  Record record = 4; Attachment attachment = 5; ucupa.network.Token preparation = 6 [(ucupa.network.token_kind) = OBSERVATION_PREPARATION];
  optional bytes closure = 7;
  PublicSourceGraph source_graph = 8;
}
message ListDirectResult {
  ucupa.network.Token receipt = 1 [(ucupa.network.required_value) = true, (ucupa.network.token_kind) = READ_RECEIPT];
  optional ReadMode read_mode = 2 [(ucupa.network.required_value) = true];
