service CoreService {
  rpc Enter(EnterRequest) returns (EnterResponse);
  rpc Close(CloseRequest) returns (CloseResponse);
  rpc ReadElement(ReadElementRequest) returns (ReadElementResponse);
  rpc ListDirect(ListDirectRequest) returns (ListDirectResponse);
