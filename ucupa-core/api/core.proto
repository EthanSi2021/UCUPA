syntax = "proto3";
package ucupa.core;
option go_package = "ucupa/ucupa-core/bindings/go/protobuf;corepb";
import "shared/api/network.proto";

service WriterControlService {
 rpc InspectWriter(ucupa.network.WriterInspectRequest) returns (ucupa.network.WriterResponse);
 rpc HandoffWriter(ucupa.network.WriterHandoffRequest) returns (ucupa.network.WriterResponse);
}

// Source and parent control. Recovery supplies a target approval, never caller-authored
// fence/decision evidence. Operation IDs retain their exact bytes across retries.
service TransitionControlService {
 rpc BeginTransition(BeginTransitionRequest) returns (TransitionResponse);
 rpc InspectTransition(InspectTransitionRequest) returns (TransitionResponse);
 rpc CancelTransition(CancelTransitionRequest) returns (TransitionResponse);
 rpc RecoverTransition(RecoverTransitionRequest) returns (TransitionResponse);
 rpc BeginCarrierTransition(BeginCarrierTransitionRequest) returns (CarrierTransitionResponse);
 rpc InspectCarrierTransition(InspectCarrierTransitionRequest) returns (CarrierTransitionResponse);
 rpc CancelCarrierTransition(CancelCarrierTransitionRequest) returns (CarrierTransitionResponse);
 rpc RecoverCarrierTransition(RecoverCarrierTransitionRequest) returns (CarrierTransitionResponse);
}
// The receiving Core is Parent; Source and Target are the two carriers.
// Comparisons belong to Parent. No caller identity, fence or manifest is input.
message BeginCarrierTransitionRequest {
 optional bytes operation_id = 1 [(ucupa.network.required_value) = true];
 optional string source = 2 [(ucupa.network.required_value) = true];
 optional string target = 3 [(ucupa.network.required_value) = true];
 optional string mount = 4 [(ucupa.network.required_value) = true];
 ucupa.network.Token expected_element = 5 [(ucupa.network.required_value) = true, (ucupa.network.token_kind) = RECORD_REVISION];
 ucupa.network.Token expected_mount = 6 [(ucupa.network.required_value) = true, (ucupa.network.token_kind) = MOUNT_REVISION];
 optional string parent_address = 7 [(ucupa.network.required_value) = true];
 optional string source_address = 8 [(ucupa.network.required_value) = true];
 optional string target_address = 9 [(ucupa.network.required_value) = true];
}
message InspectCarrierTransitionRequest {
 optional bytes operation_id = 1 [(ucupa.network.required_value) = true];
 optional string mount = 2 [(ucupa.network.required_value) = true];
}
message CancelCarrierTransitionRequest {
 optional bytes operation_id = 1 [(ucupa.network.required_value) = true];
 optional string mount = 2 [(ucupa.network.required_value) = true];
 ucupa.network.Token expected = 3 [(ucupa.network.required_value) = true, (ucupa.network.token_kind) = CARRIER_REVISION];
}
// Parent-owned recovery. The two tokens are the separately issued source and
// target approvals; neither confers permission by itself and neither is
// refreshed implicitly. Operation IDs retain their exact bytes across retries.
message RecoverCarrierTransitionRequest {
 CarrierApprovalBinding binding = 1 [(ucupa.network.required_value) = true];
 bytes source_token = 2 [(ucupa.network.required_value) = true];
 bytes target_token = 3 [(ucupa.network.required_value) = true];
}
enum CarrierProgress {
 CARRIER_PROGRESS_UNSPECIFIED = 0;
 CARRIER_RESERVED = 1; CARRIER_PERMITTED = 2; CARRIER_CANCELLED = 3;
 CARRIER_COMMITTED = 4; CARRIER_SETTLED = 5;
}
message CarrierStatus {
 optional string parent = 1 [(ucupa.network.required_value) = true];
 optional string source = 2 [(ucupa.network.required_value) = true];
 optional string target = 3 [(ucupa.network.required_value) = true];
 optional bytes operation_id = 4 [(ucupa.network.required_value) = true];
 optional string mount = 5 [(ucupa.network.required_value) = true];
 optional CarrierProgress progress = 6 [(ucupa.network.required_value) = true];
 ucupa.network.Token revision = 7 [(ucupa.network.required_value) = true, (ucupa.network.token_kind) = CARRIER_REVISION];
}
message CarrierTransitionResponse { oneof outcome { CarrierStatus result = 1; ucupa.network.Failure error = 2; } }

// Parent evidence is read from the actual controller over authenticated peer
// TLS. Neither the public binding nor these service values confer permission.
message CarrierApprovalBinding {
 optional string parent = 1 [(ucupa.network.required_value) = true];
 BeginCarrierTransitionRequest command = 2 [(ucupa.network.required_value) = true];
}
service TransitionParentService {
 rpc ReadCarrierPlan(ReadCarrierPlanRequest) returns (ReadCarrierPlanResponse);
 rpc ReadCarrierDecision(ReadCarrierDecisionRequest) returns (ReadCarrierDecisionResponse);
}
message ReadCarrierPlanRequest { CarrierApprovalBinding binding = 1 [(ucupa.network.required_value) = true]; }
message ReadCarrierDecisionRequest { CarrierApprovalBinding binding = 1 [(ucupa.network.required_value) = true]; }
message ServiceCarrierReservation {
 TransitionActor actor = 1 [(ucupa.network.required_value) = true];
 ServiceRevision expected_element = 2 [(ucupa.network.required_value) = true];
 ServiceRevision expected_mount = 3 [(ucupa.network.required_value) = true];
 ServiceMountAdmission previous = 4 [(ucupa.network.required_value) = true];
 ServiceRevision previous_contact = 5 [(ucupa.network.required_value) = true];
 SpatialTuple tuple = 6 [(ucupa.network.required_value) = true];
 ServiceMountKey next_key = 7 [(ucupa.network.required_value) = true];
 ServiceCoreCut at = 8 [(ucupa.network.required_value) = true];
}
message ServiceCarrierRefusal {
 ServiceCoreCut at = 1 [(ucupa.network.required_value) = true];
 optional uint64 revision = 2 [(ucupa.network.required_value) = true];
}
message CarrierPlan {
 CarrierApprovalBinding binding = 1 [(ucupa.network.required_value) = true];
 ServiceCarrierReservation reservation = 2 [(ucupa.network.required_value) = true];
 ServiceCoreCut permitted_at = 3;
 ServiceCoreCut cancelled_at = 4;
 ServiceCarrierRefusal refusal = 5;
}
message ReadCarrierPlanResponse { oneof outcome { CarrierPlan result = 1; ucupa.network.Failure failure = 2; } }
message CarrierDecision {
 CarrierPlan plan = 1 [(ucupa.network.required_value) = true];
 ServiceCoreCut final_cut = 2 [(ucupa.network.required_value) = true];
 bytes manifest_digest = 3 [(ucupa.network.required_value) = true];
 optional uint64 fence_revision = 4 [(ucupa.network.required_value) = true];
 ServiceCoreCut accepted_at = 5 [(ucupa.network.required_value) = true];
 optional uint64 acceptance_revision = 6 [(ucupa.network.required_value) = true];
 ServiceCoreCut decided_at = 7 [(ucupa.network.required_value) = true];
 optional uint64 decision_revision = 8 [(ucupa.network.required_value) = true];
}
message ReadCarrierDecisionResponse { oneof outcome { CarrierDecision result = 1; ucupa.network.Failure failure = 2; } }
message RecoverTransitionRequest {
 TransitionApprovalBinding binding = 1 [(ucupa.network.required_value) = true];
 bytes approval_token = 2 [(ucupa.network.required_value) = true];
}
enum TransitionKind { TRANSITION_KIND_UNSPECIFIED = 0; TRANSITION_SLICE = 1; TRANSITION_ROOT = 2; }
enum TransitionProgress {
 TRANSITION_PROGRESS_UNSPECIFIED = 0;
 TRANSITION_INTENT = 1; TRANSITION_CANCELLED = 2; TRANSITION_FENCED = 3;
 TRANSITION_COMMITTED = 4; TRANSITION_SETTLED = 5;
}
message BeginTransitionRequest {
 optional bytes operation_id = 1 [(ucupa.network.required_value) = true];
 optional TransitionKind kind = 2 [(ucupa.network.required_value) = true];
 optional string target = 3 [(ucupa.network.required_value) = true];
 optional string boundary = 4 [(ucupa.network.required_value) = true];
 ucupa.network.Token expected = 5 [(ucupa.network.required_value) = true, (ucupa.network.token_kind) = RECORD_REVISION];
 SpatialTuple final = 6; // Required for slice, absent for root.
 optional string source_address = 7 [(ucupa.network.required_value) = true];
 optional string target_address = 8 [(ucupa.network.required_value) = true];
}
message InspectTransitionRequest {
 optional bytes operation_id = 1 [(ucupa.network.required_value) = true];
 optional string boundary = 2 [(ucupa.network.required_value) = true];
}
message CancelTransitionRequest {
 optional bytes operation_id = 1 [(ucupa.network.required_value) = true];
 optional string boundary = 2 [(ucupa.network.required_value) = true];
 ucupa.network.Token expected = 3 [(ucupa.network.required_value) = true, (ucupa.network.token_kind) = TRANSITION_REVISION];
}
message TransitionStatus {
 optional string source = 1 [(ucupa.network.required_value) = true];
 optional bytes operation_id = 2 [(ucupa.network.required_value) = true];
 optional TransitionKind kind = 3 [(ucupa.network.required_value) = true];
 optional string target = 4 [(ucupa.network.required_value) = true];
 optional string boundary = 5 [(ucupa.network.required_value) = true];
 optional TransitionProgress progress = 6 [(ucupa.network.required_value) = true];
 ucupa.network.Token revision = 7 [(ucupa.network.required_value) = true, (ucupa.network.token_kind) = TRANSITION_REVISION];
}
message TransitionResponse { oneof outcome { TransitionStatus result = 1; ucupa.network.Failure error = 2; } }

// Target-issued, runtime-only approval. The original target caller/view stays
// inside admission; only the designated authenticated source may check it.
message TransitionApprovalBinding {
 optional string source = 1 [(ucupa.network.required_value) = true];
 BeginTransitionRequest command = 2 [(ucupa.network.required_value) = true];
}
message CreateTransitionApprovalRequest {
 TransitionApprovalBinding binding = 1 [(ucupa.network.required_value) = true];
 optional uint64 ttl_seconds = 2 [(ucupa.network.required_value) = true];
}
message TransitionApproval {
 optional string target = 1 [(ucupa.network.required_value) = true];
 TransitionApprovalBinding binding = 2 [(ucupa.network.required_value) = true];
 optional bytes token = 3 [(ucupa.network.required_value) = true];
 optional uint64 expires_in_seconds = 4 [(ucupa.network.required_value) = true];
}
message CreateTransitionApprovalResponse { oneof outcome { TransitionApproval result = 1; ucupa.network.Failure failure = 2; } }
message CheckTransitionApprovalRequest {
 TransitionApprovalBinding binding = 1 [(ucupa.network.required_value) = true];
 optional bytes token = 2 [(ucupa.network.required_value) = true];
}
message TransitionApprovalCheck {
 optional string target = 1 [(ucupa.network.required_value) = true];
 TransitionApprovalBinding binding = 2 [(ucupa.network.required_value) = true];
 optional string realm = 3 [(ucupa.network.required_value) = true];
 optional string principal = 4 [(ucupa.network.required_value) = true];
}
message CheckTransitionApprovalResponse { oneof outcome { TransitionApprovalCheck result = 1; ucupa.network.Failure failure = 2; } }
message RevokeTransitionApprovalRequest { optional bytes token = 1 [(ucupa.network.required_value) = true]; }
message RevokeTransitionApprovalResponse { optional bool released = 1 [(ucupa.network.required_value) = true]; }
service TransitionApprovalService {
 rpc CreateTransitionApproval(CreateTransitionApprovalRequest) returns (CreateTransitionApprovalResponse);
 rpc CheckTransitionApproval(CheckTransitionApprovalRequest) returns (CheckTransitionApprovalResponse);
 rpc RevokeTransitionApproval(RevokeTransitionApprovalRequest) returns (RevokeTransitionApprovalResponse);
}

// Carrier approvals are issued separately by the source carrier's export
// caller and the target carrier's import caller. The parent is the only
// designated checker; a check re-validates the retained original caller/view.
// The source preflight is not a check: it proves one live approval exists.
message CreateCarrierApprovalRequest {
 CarrierApprovalBinding binding = 1 [(ucupa.network.required_value) = true];
 optional uint64 ttl_seconds = 2 [(ucupa.network.required_value) = true];
}
message CarrierApproval {
 optional string issuer = 1 [(ucupa.network.required_value) = true];
 CarrierApprovalBinding binding = 2 [(ucupa.network.required_value) = true];
 optional bytes token = 3 [(ucupa.network.required_value) = true];
 optional uint64 expires_in_seconds = 4 [(ucupa.network.required_value) = true];
}
message CreateCarrierApprovalResponse { oneof outcome { CarrierApproval result = 1; ucupa.network.Failure failure = 2; } }
message CheckCarrierApprovalRequest {
 CarrierApprovalBinding binding = 1 [(ucupa.network.required_value) = true];
 bytes token = 2;
}
message CarrierApprovalCheck {
 optional string issuer = 1 [(ucupa.network.required_value) = true];
 CarrierApprovalBinding binding = 2 [(ucupa.network.required_value) = true];
 optional string realm = 3 [(ucupa.network.required_value) = true];
 optional string principal = 4 [(ucupa.network.required_value) = true];
}
message CheckCarrierApprovalResponse { oneof outcome { CarrierApprovalCheck result = 1; ucupa.network.Failure failure = 2; } }
message RevokeCarrierApprovalRequest { optional bytes token = 1 [(ucupa.network.required_value) = true]; }
message RevokeCarrierApprovalResponse { optional bool released = 1 [(ucupa.network.required_value) = true]; }
service CarrierApprovalService {
 rpc CreateCarrierApproval(CreateCarrierApprovalRequest) returns (CreateCarrierApprovalResponse);
 rpc CheckCarrierApproval(CheckCarrierApprovalRequest) returns (CheckCarrierApprovalResponse);
 rpc RevokeCarrierApproval(RevokeCarrierApprovalRequest) returns (RevokeCarrierApprovalResponse);
}

// Read-only evidence from the designated source. No request contains a fence,
// acceptance or decision supplied by the caller. Mutual TLS binds the target.
service TransitionSourceService {
 rpc ReadTransitionChunk(ReadTransitionChunkRequest) returns (ReadTransitionChunkResponse);
 rpc ReadTransitionDecision(ReadTransitionDecisionRequest) returns (ReadTransitionDecisionResponse);
 rpc FenceCarrierSource(FenceCarrierSourceRequest) returns (FenceCarrierSourceResponse);
 rpc ReadCarrierSourceChunk(ReadCarrierSourceChunkRequest) returns (ReadCarrierSourceChunkResponse);
 rpc SettleCarrierSource(SettleCarrierSourceRequest) returns (SettleCarrierSourceResponse);
}
message ServiceTransitionFence {
 TransitionActor actor = 1 [(ucupa.network.required_value) = true];
 ServiceRevision expected = 2 [(ucupa.network.required_value) = true];
 ServiceCoreCut final_cut = 3 [(ucupa.network.required_value) = true];
 optional bytes manifest_digest = 4 [(ucupa.network.required_value) = true];
}
// Retained original identity bytes, not credentials or a new caller assertion.
message TransitionActor {
 optional bytes realm = 1 [(ucupa.network.required_value) = true];
 optional bytes principal = 2 [(ucupa.network.required_value) = true];
}
message ReadTransitionChunkRequest {
 TransitionApprovalBinding binding = 1 [(ucupa.network.required_value) = true];
 optional uint64 offset = 2 [(ucupa.network.required_value) = true];
 optional uint32 max_bytes = 3 [(ucupa.network.required_value) = true];
}
message TransitionChunk {
 TransitionApprovalBinding binding = 1 [(ucupa.network.required_value) = true];
 ServiceTransitionFence fence = 2 [(ucupa.network.required_value) = true];
 optional uint64 total_bytes = 3 [(ucupa.network.required_value) = true];
 optional uint64 offset = 4 [(ucupa.network.required_value) = true];
 optional bytes data = 5 [(ucupa.network.required_value) = true];
}
message ReadTransitionChunkResponse { oneof outcome { TransitionChunk result = 1; ucupa.network.Failure failure = 2; } }
message ReadTransitionDecisionRequest { TransitionApprovalBinding binding = 1 [(ucupa.network.required_value) = true]; }
message TransitionDecision {
 TransitionApprovalBinding binding = 1 [(ucupa.network.required_value) = true];
 ServiceTransitionFence fence = 2 [(ucupa.network.required_value) = true];
 ServiceCoreCut accepted_at = 3 [(ucupa.network.required_value) = true];
 optional uint64 acceptance_revision = 4 [(ucupa.network.required_value) = true];
 ServiceCoreCut decided_at = 5 [(ucupa.network.required_value) = true];
 optional uint64 decision_revision = 6 [(ucupa.network.required_value) = true];
}
message ReadTransitionDecisionResponse { oneof outcome { TransitionDecision result = 1; ucupa.network.Failure failure = 2; } }

// Carrier source evidence. The approval token is the source carrier's own
// export approval; the parent never supplies fence or manifest bytes.
message FenceCarrierSourceRequest {
 CarrierApprovalBinding binding = 1 [(ucupa.network.required_value) = true];
 bytes approval_token = 2 [(ucupa.network.required_value) = true];
}
message ServiceCarrierFence {
 CarrierPlan permit = 1 [(ucupa.network.required_value) = true];
 ServiceCoreCut final_cut = 2 [(ucupa.network.required_value) = true];
 bytes manifest_digest = 3 [(ucupa.network.required_value) = true];
 optional uint64 revision = 4 [(ucupa.network.required_value) = true];
}
message FenceCarrierSourceResponse { oneof outcome { ServiceCarrierFence result = 1; ucupa.network.Failure failure = 2; } }
message ReadCarrierSourceChunkRequest {
 CarrierApprovalBinding binding = 1 [(ucupa.network.required_value) = true];
 optional uint64 offset = 2 [(ucupa.network.required_value) = true];
 optional uint32 max_bytes = 3 [(ucupa.network.required_value) = true];
}
message CarrierSourceChunk {
 CarrierApprovalBinding binding = 1 [(ucupa.network.required_value) = true];
 ServiceCarrierFence fence = 2 [(ucupa.network.required_value) = true];
 optional uint64 total_bytes = 3 [(ucupa.network.required_value) = true];
 optional uint64 offset = 4 [(ucupa.network.required_value) = true];
 optional bytes data = 5 [(ucupa.network.required_value) = true];
}
message ReadCarrierSourceChunkResponse { oneof outcome { CarrierSourceChunk result = 1; ucupa.network.Failure failure = 2; } }
message SettleCarrierSourceRequest { CarrierApprovalBinding binding = 1 [(ucupa.network.required_value) = true]; }
message SettleCarrierSourceResponse { optional bool settled = 1 [(ucupa.network.required_value) = true]; }

// Only authenticated service peers use these methods. The receiver obtains
// source evidence itself; a caller cannot submit a fence or decision as proof.
service TransitionTargetService {
 rpc AcceptTransition(AcceptTransitionRequest) returns (AcceptTransitionResponse);
 rpc InstallTransition(InstallTransitionRequest) returns (InstallTransitionResponse);
 rpc CheckCarrierImport(CheckCarrierImportRequest) returns (CheckCarrierImportResponse);
 rpc AcceptCarrierTarget(AcceptCarrierTargetRequest) returns (AcceptCarrierTargetResponse);
 rpc InstallCarrierTarget(InstallCarrierTargetRequest) returns (InstallCarrierTargetResponse);
 rpc ReadCarrierCompletion(ReadCarrierCompletionRequest) returns (ReadCarrierCompletionResponse);
}
message AcceptTransitionRequest {
 TransitionApprovalBinding binding = 1 [(ucupa.network.required_value) = true];
 bytes approval_token = 2 [(ucupa.network.required_value) = true];
}
message TransitionAcceptance {
 TransitionApprovalBinding binding = 1 [(ucupa.network.required_value) = true];
 ServiceTransitionFence fence = 2 [(ucupa.network.required_value) = true];
 ServiceCoreCut accepted_at = 3 [(ucupa.network.required_value) = true];
 optional uint64 acceptance_revision = 4 [(ucupa.network.required_value) = true];
}
message AcceptTransitionResponse { oneof outcome { TransitionAcceptance result = 1; ucupa.network.Failure failure = 2; } }
message InstallTransitionRequest { TransitionApprovalBinding binding = 1 [(ucupa.network.required_value) = true]; }
message TransitionCompletion {
 TransitionDecision decision = 1 [(ucupa.network.required_value) = true];
 ServiceCoreCut installed_at = 2 [(ucupa.network.required_value) = true];
 optional uint64 installation_revision = 3 [(ucupa.network.required_value) = true];
 ServiceCoreCut completed_at = 4 [(ucupa.network.required_value) = true];
 optional uint64 completion_revision = 5 [(ucupa.network.required_value) = true];
}
message InstallTransitionResponse { oneof outcome { TransitionCompletion result = 1; ucupa.network.Failure failure = 2; } }

// Carrier target admission. CheckCarrierImport serves two authenticated peers:
// the parent with its import approval token, and the source carrier's stateless
// preflight, which only proves one live approval exists for the exact binding.
message CheckCarrierImportRequest {
 CarrierApprovalBinding binding = 1 [(ucupa.network.required_value) = true];
 bytes token = 2;
}
// CarrierImportPreflight is the tokenless source-side answer. It proves one
// live original import approval exists for the exact binding and discloses no
// approver identity.
message CarrierImportPreflight {
 optional string issuer = 1 [(ucupa.network.required_value) = true];
 CarrierApprovalBinding binding = 2 [(ucupa.network.required_value) = true];
}
message CheckCarrierImportResponse { oneof outcome { CarrierApprovalCheck result = 1; ucupa.network.Failure failure = 2; CarrierImportPreflight preflight = 3; } }
message AcceptCarrierTargetRequest {
 CarrierApprovalBinding binding = 1 [(ucupa.network.required_value) = true];
 bytes approval_token = 2 [(ucupa.network.required_value) = true];
}
message CarrierTargetAcceptance {
 CarrierApprovalBinding binding = 1 [(ucupa.network.required_value) = true];
 ServiceCarrierFence fence = 2 [(ucupa.network.required_value) = true];
 ServiceCoreCut accepted_at = 3 [(ucupa.network.required_value) = true];
 optional uint64 acceptance_revision = 4 [(ucupa.network.required_value) = true];
}
message AcceptCarrierTargetResponse { oneof outcome { CarrierTargetAcceptance result = 1; ucupa.network.Failure failure = 2; } }
message InstallCarrierTargetRequest { CarrierApprovalBinding binding = 1 [(ucupa.network.required_value) = true]; }
message CarrierCompletion {
 CarrierDecision decision = 1 [(ucupa.network.required_value) = true];
 ServiceCoreCut installed_at = 2 [(ucupa.network.required_value) = true];
 optional uint64 installation_revision = 3 [(ucupa.network.required_value) = true];
 ServiceCoreCut completed_at = 4 [(ucupa.network.required_value) = true];
 optional uint64 completion_revision = 5 [(ucupa.network.required_value) = true];
}
message InstallCarrierTargetResponse { oneof outcome { CarrierCompletion result = 1; ucupa.network.Failure failure = 2; } }
message ReadCarrierCompletionRequest { CarrierApprovalBinding binding = 1 [(ucupa.network.required_value) = true]; }
message ReadCarrierCompletionResponse { oneof outcome { CarrierCompletion result = 1; ucupa.network.Failure failure = 2; } }

enum Intent {
  INTENT_UNSPECIFIED = 0;
  READ = 1 [(ucupa.network.literal) = "read"];
  LIST = 2 [(ucupa.network.literal) = "list"];
  QUERY = 3 [(ucupa.network.literal) = "query"];
  CREATE_ANCHOR = 4 [(ucupa.network.literal) = "create-anchor"];
  CREATE_ENTITY = 5 [(ucupa.network.literal) = "create-entity"];
  UPDATE_ANCHOR = 6 [(ucupa.network.literal) = "update-anchor"];
  UPDATE_ENTITY = 7 [(ucupa.network.literal) = "update-entity"];
  DELETE_ANCHOR = 8 [(ucupa.network.literal) = "delete-anchor"];
  DELETE_ENTITY = 9 [(ucupa.network.literal) = "delete-entity"];
}
enum ElementKind { ELEMENT_UNSPECIFIED = 0; ANCHOR = 1 [(ucupa.network.literal) = "anchor"]; ENTITY = 2 [(ucupa.network.literal) = "entity"]; }
enum RangeKind { RANGE_UNSPECIFIED = 0; BOUNDED_SPHERE = 1 [(ucupa.network.literal) = "bounded-sphere"]; UNBOUNDED_ROOT = 2 [(ucupa.network.literal) = "unbounded-root"]; }
enum Selector { SELECTOR_UNSPECIFIED = 0; ANCHORS = 1 [(ucupa.network.literal) = "anchors"]; ENTITIES = 2 [(ucupa.network.literal) = "entities"]; BOTH = 3 [(ucupa.network.literal) = "both"]; }
enum ReadMode { READ_MODE_UNSPECIFIED = 0; CURRENT_VERIFIED = 1; RETAINED = 2; }
enum Presence { PRESENCE_UNSPECIFIED = 0; PRESENT = 1; NOT_FOUND = 2; }
enum Coverage { COVERAGE_UNSPECIFIED = 0; COMPLETE = 1; PARTIAL = 2; }
enum QueryGap { QUERY_GAP_UNSPECIFIED = 0; UNRESOLVED_COVERAGE = 1; EXACT_WORK_LIMIT = 2; }
enum AttachmentState { ATTACHMENT_UNSPECIFIED = 0; NONE = 1; ACTIVE = 2; DETACHED = 3; RETIRED = 4; }
enum CommitStatus { COMMIT_UNSPECIFIED = 0; COMMITTED = 1; UNCHANGED = 2; }
enum Category { CATEGORY_UNSPECIFIED = 0; SPATIAL = 1 [(ucupa.network.literal) = "spatial"]; CONTENT = 2 [(ucupa.network.literal) = "content"]; ATTACHMENT = 3 [(ucupa.network.literal) = "attachment"]; CONTACT = 4 [(ucupa.network.literal) = "contact"]; TERMINAL = 5 [(ucupa.network.literal) = "terminal"]; }

message Rotation { optional uint32 pivot = 1 [(ucupa.network.required_value) = true]; ucupa.network.Vector3 ratios = 2 [(ucupa.network.required_value) = true]; }
message Pose { ucupa.network.Vector3 translation = 1 [(ucupa.network.required_value) = true]; Rotation rotation = 2 [(ucupa.network.required_value) = true]; }
message Range { optional RangeKind kind = 1 [(ucupa.network.required_value) = true]; optional double radius = 2; }
message SpatialTuple {
  optional string parent = 1 [(ucupa.network.required_value) = true];
  Pose pose = 2 [(ucupa.network.required_value) = true];
  Range range = 3 [(ucupa.network.required_value) = true];
}
message Sphere { ucupa.network.Vector3 center = 1 [(ucupa.network.required_value) = true]; optional double radius = 2 [(ucupa.network.required_value) = true]; }
message Record {
  optional ElementKind kind = 1 [(ucupa.network.required_value) = true];
  optional string element = 2 [(ucupa.network.required_value) = true];
  ucupa.network.Token revision = 3 [(ucupa.network.required_value) = true, (ucupa.network.token_kind) = RECORD_REVISION];
  Range range = 4 [(ucupa.network.required_value) = true];
  optional string parent = 5; Pose pose = 6; ucupa.network.Address address = 7;
}
message Attachment {
  optional AttachmentState state = 1 [(ucupa.network.required_value) = true];
  ucupa.network.Token revision = 2 [(ucupa.network.required_value) = true, (ucupa.network.token_kind) = ATTACHMENT_REVISION];
  ucupa.network.AttachmentKey key = 3; optional string next_hop = 4; ucupa.network.Token contact_revision = 5 [(ucupa.network.token_kind) = CONTACT_REVISION];
}
message Match {
  optional string element = 1 [(ucupa.network.required_value) = true];
  optional ElementKind kind = 2 [(ucupa.network.required_value) = true];
  ucupa.network.Token revision = 3 [(ucupa.network.required_value) = true, (ucupa.network.token_kind) = RECORD_REVISION];
  ucupa.network.Address address = 4 [(ucupa.network.required_value) = true];
}
message ChangeGroup {
  ucupa.network.Token change_id = 1 [(ucupa.network.required_value) = true, (ucupa.network.token_kind) = CHANGE_ID];
  optional string owner = 2 [(ucupa.network.required_value) = true];
  repeated Category category = 3;
  ucupa.network.Token basis = 4 [(ucupa.network.required_value) = true, (ucupa.network.token_kind) = CHANGE_BASIS];
  optional TransitionTerminal terminal = 5;
}
// The one terminal transition evidence a source observation discloses when its
// old scope provably ended under one unique committed successor decision. It
// binds no manifest content and grants no access to the successor.
message TransitionTerminal {
