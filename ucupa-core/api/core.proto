  optional Coverage status = 6 [(ucupa.network.required_value) = true];
  optional QueryGap gap = 7; ucupa.network.Token continuation = 8 [(ucupa.network.token_kind) = QUERY_CONTINUATION]; ucupa.network.Token preparation = 9 [(ucupa.network.token_kind) = OBSERVATION_PREPARATION];
  optional bytes closure = 10;
  PublicSourceGraph source_graph = 11;
}
message MutationResult {
  optional CommitStatus status = 1 [(ucupa.network.required_value) = true];
  oneof outcome { Record record = 2; ucupa.network.Token tombstone_revision = 3 [(ucupa.network.token_kind) = RECORD_REVISION]; }
}
