  rpc RepairMountContact(RepairMountContactRequest) returns (RepairMountContactResponse);
}

// Original user relationship controls. These are not fixed-service evidence
// ports; all comparisons are Core-issued public opaque tokens.
message PublicFacetCommand {
  optional string kind = 1 [(ucupa.network.required_value) = true];
  optional string element = 2 [(ucupa.network.required_value) = true];
  ucupa.network.Token expected = 3 [(ucupa.network.required_value) = true];
  optional string target = 4;
  optional string next_hop = 5;
}
message PublicFacetInspection {
  optional string element = 1 [(ucupa.network.required_value) = true];
  optional AttachmentState state = 2 [(ucupa.network.required_value) = true];
  ucupa.network.Token revision = 3 [(ucupa.network.required_value) = true, (ucupa.network.token_kind) = ATTACHMENT_REVISION];
  optional string target = 4;
  ucupa.network.Token proposal = 5 [(ucupa.network.token_kind) = ATTACHMENT_REVISION];
  optional string pending_target = 6;
  ucupa.network.Token pending_proposal = 7 [(ucupa.network.token_kind) = ATTACHMENT_REVISION];
  optional string next_hop = 8;
  ucupa.network.Token contact_revision = 9 [(ucupa.network.token_kind) = CONTACT_REVISION];
  // Current key owner for ACTIVE, original key owner for DETACHED; no access grant.
  optional string key_core = 10;
}
message InspectFacetRequest { optional string element = 1 [(ucupa.network.required_value) = true]; }
message InspectFacetResponse { oneof outcome { PublicFacetInspection result = 1; ucupa.network.Failure failure = 2; } }
message ApplyFacetRequest {
  optional bytes operation_id = 1 [(ucupa.network.required_value) = true];
  PublicFacetCommand command = 2 [(ucupa.network.required_value) = true];
}
message PublicFacetOutcome {
  optional bytes operation_id = 1 [(ucupa.network.required_value) = true];
  optional uint32 status = 2 [(ucupa.network.required_value) = true];
  PublicFacetInspection state = 3 [(ucupa.network.required_value) = true];
}
message ApplyFacetResponse { oneof outcome { PublicFacetOutcome result = 1; ucupa.network.Failure failure = 2; } }
service FacetControlService {
  rpc InspectFacet(InspectFacetRequest) returns (InspectFacetResponse);
  rpc ApplyFacet(ApplyFacetRequest) returns (ApplyFacetResponse);
  rpc BeginFacetReplacement(BeginFacetReplacementRequest) returns (FacetReplacementStatusResponse);
  rpc RecoverFacetReplacement(ReplacementControlRequest) returns (FacetReplacementStatusResponse);
  rpc InspectFacetReplacement(ReplacementControlRequest) returns (FacetReplacementStatusResponse);
  rpc CancelFacetReplacement(CancelFacetReplacementRequest) returns (FacetReplacementStatusResponse);
}
// Caller-visible comparisons only; the current content owner is disclosed from
// the retained record, never chosen by the caller.
message PublicFacetReplacementCommand {
  optional string element = 1 [(ucupa.network.required_value) = true];
  ucupa.network.Token expected = 2 [(ucupa.network.required_value) = true, (ucupa.network.token_kind) = ATTACHMENT_REVISION];
  optional string target = 3 [(ucupa.network.required_value) = true];
  optional string target_address = 4 [(ucupa.network.required_value) = true];
  optional string source_address = 5 [(ucupa.network.required_value) = true];
}
message BeginFacetReplacementRequest {
  optional bytes operation_id = 1 [(ucupa.network.required_value) = true];
  PublicFacetReplacementCommand command = 2 [(ucupa.network.required_value) = true];
}
message ReplacementControlRequest {
  optional bytes operation_id = 1 [(ucupa.network.required_value) = true];
  optional string element = 2 [(ucupa.network.required_value) = true];
}
message CancelFacetReplacementRequest {
  optional bytes operation_id = 1 [(ucupa.network.required_value) = true];
  optional string element = 2 [(ucupa.network.required_value) = true];
  ucupa.network.Token expected = 3 [(ucupa.network.required_value) = true, (ucupa.network.token_kind) = FACET_REPLACEMENT_REVISION];
}
// The separately authorized control projection: milestones and the stable
// public revision comparison, never manifest bytes or private cuts.
message FacetReplacementStatus {
  optional string element = 1 [(ucupa.network.required_value) = true];
  optional bytes operation_id = 2 [(ucupa.network.required_value) = true];
  optional string source = 3 [(ucupa.network.required_value) = true];
  optional string target = 4 [(ucupa.network.required_value) = true];
  optional uint32 progress = 5 [(ucupa.network.required_value) = true];
  optional bool refused = 6 [(ucupa.network.required_value) = true];
  ucupa.network.Token revision = 7 [(ucupa.network.required_value) = true, (ucupa.network.token_kind) = FACET_REPLACEMENT_REVISION];
}
message FacetReplacementStatusResponse { oneof outcome { FacetReplacementStatus result = 1; ucupa.network.Failure failure = 2; } }

// Owner-local immutable read portions. These are private authenticated service
// exchanges, never a public grant to enumerate raw owner storage. A finite
// identity challenge binds the original caller to precisely one read request.
message FederationReadRequest {
  optional string boundary = 1 [(ucupa.network.required_value) = true];
  ServiceMountKey incoming = 2;
  optional Intent intent = 3 [(ucupa.network.required_value) = true];
  optional bool prepare_observe = 4 [(ucupa.network.required_value) = true];
  optional ReadMode mode = 5;
  optional bytes purpose = 6 [(ucupa.network.required_value) = true];
}
message FederationMountRelation {
  optional bool incoming = 1 [(ucupa.network.required_value) = true];
  optional uint32 state = 2 [(ucupa.network.required_value) = true];
  ServiceMountKey key = 3 [(ucupa.network.required_value) = true];
  ServiceMountAdmission admission = 4 [(ucupa.network.required_value) = true];
  ucupa.network.Token revision = 5 [(ucupa.network.required_value) = true, (ucupa.network.token_kind) = MOUNT_REVISION];
  ucupa.network.Token contact = 6 [(ucupa.network.required_value) = true, (ucupa.network.token_kind) = CONTACT_REVISION];
  optional string next_hop = 7 [(ucupa.network.required_value) = true];
  Range range = 8 [(ucupa.network.required_value) = true];
  optional bool write_gate_open = 9 [(ucupa.network.required_value) = true];
}
message FederationReadPart {
  ucupa.network.Token basis = 1 [(ucupa.network.required_value) = true, (ucupa.network.token_kind) = READ_RECEIPT];
  optional string boundary = 2 [(ucupa.network.required_value) = true];
  optional bytes purpose = 3 [(ucupa.network.required_value) = true];
  optional ReadMode read_mode = 4 [(ucupa.network.required_value) = true];
  FederationMountRelation incoming = 5;
  ucupa.network.Token preparation = 6 [(ucupa.network.token_kind) = OBSERVATION_PREPARATION];
  ServicePrincipal subject = 7 [(ucupa.network.required_value) = true];
  optional bytes cut_stamp = 8 [(ucupa.network.required_value) = true];
  optional bytes authorization_stamp = 9 [(ucupa.network.required_value) = true];
  optional bool hidden = 10 [(ucupa.network.required_value) = true];
}
message FederationRecord {
  optional string element = 1 [(ucupa.network.required_value) = true];
  optional ElementKind kind = 2 [(ucupa.network.required_value) = true];
  optional string parent = 3;
  Pose pose = 4;
  Range range = 5 [(ucupa.network.required_value) = true];
  ucupa.network.Token revision = 6 [(ucupa.network.required_value) = true, (ucupa.network.token_kind) = RECORD_REVISION];
  ucupa.network.ElementPath path = 7 [(ucupa.network.required_value) = true];
  PublicFacetInspection attachment = 8;
  FederationMountRelation mount = 9;
}
message FederationPoseStep {
  Pose pose = 1 [(ucupa.network.required_value) = true];
  optional bool inverse = 2 [(ucupa.network.required_value) = true];
}
message FederationPathRequest {
  optional string origin = 1 [(ucupa.network.required_value) = true];
  optional uint64 up = 2 [(ucupa.network.required_value) = true];
  ucupa.network.ElementPath down = 3 [(ucupa.network.required_value) = true];
}
message FederationQueryRequest {
  optional string scope = 1 [(ucupa.network.required_value) = true];
  Sphere sphere = 2 [(ucupa.network.required_value) = true];
  optional Selector selector = 3 [(ucupa.network.required_value) = true];
  repeated FederationPoseStep to_basis = 4;
}
message FederationProjectionRequest {
  optional string kind = 1 [(ucupa.network.required_value) = true];
  FederationPathRequest path = 2;
  optional string element = 3;
  FederationQueryRequest query = 4;
}
message FederationSpineNode {
  optional string element = 1 [(ucupa.network.required_value) = true];
  optional string parent = 2;
  Pose pose = 3;
}
message FederationFrontier {
  FederationMountRelation relation = 1 [(ucupa.network.required_value) = true];
  ucupa.network.ElementPath path = 2 [(ucupa.network.required_value) = true];
  repeated FederationPoseStep to_scope = 3;
}
message FederationPathResult {
  optional string element = 1 [(ucupa.network.required_value) = true];
  optional ElementKind kind = 2 [(ucupa.network.required_value) = true];
  optional uint64 actual_up = 3 [(ucupa.network.required_value) = true];
  optional uint64 remaining_up = 4 [(ucupa.network.required_value) = true];
  ucupa.network.ElementPath remaining_down = 5 [(ucupa.network.required_value) = true];
  repeated FederationSpineNode spine = 6;
  FederationFrontier frontier = 7;
}
message FederationMatch {
  optional string element = 1 [(ucupa.network.required_value) = true];
  optional ElementKind kind = 2 [(ucupa.network.required_value) = true];
  ucupa.network.Token revision = 3 [(ucupa.network.required_value) = true, (ucupa.network.token_kind) = RECORD_REVISION];
  ucupa.network.ElementPath path = 4 [(ucupa.network.required_value) = true];
}
message FederationProjectionPage {
  ucupa.network.Token basis = 1 [(ucupa.network.required_value) = true, (ucupa.network.token_kind) = READ_RECEIPT];
  optional bytes purpose = 2 [(ucupa.network.required_value) = true];
  repeated FederationRecord records = 3;
  optional bool complete = 4 [(ucupa.network.required_value) = true];
  ucupa.network.Token continuation = 5 [(ucupa.network.token_kind) = QUERY_CONTINUATION];
  repeated FederationMatch matches = 6;
  repeated FederationFrontier frontiers = 7;
  FederationPathResult path = 8;
  optional uint32 gap = 9 [(ucupa.network.required_value) = true];
  optional bytes coverage = 10;
  repeated ParentAdjacencyEvidence parents = 11;
}
message BeginFederationReadChallengeRequest {
  optional string actor = 1 [(ucupa.network.required_value) = true];
  optional uint64 ttl_seconds = 2 [(ucupa.network.required_value) = true];
  optional string next_hop = 3 [(ucupa.network.required_value) = true];
  FederationReadRequest request = 4 [(ucupa.network.required_value) = true];
}
message FederationReadGrant {
  optional string target = 1 [(ucupa.network.required_value) = true];
  optional string actor = 2 [(ucupa.network.required_value) = true];
  optional bytes token = 3 [(ucupa.network.required_value) = true];
  optional uint64 expires_in_seconds = 4 [(ucupa.network.required_value) = true];
  FederationReadPart part = 5 [(ucupa.network.required_value) = true];
}
message ExchangeFederationReadIdentityResponse { oneof outcome { FederationReadGrant result = 1; ucupa.network.Failure failure = 2; } }
message ProjectFederationReadPartRequest {
  ucupa.network.Token basis = 1 [(ucupa.network.required_value) = true, (ucupa.network.token_kind) = READ_RECEIPT];
  ucupa.network.Token continuation = 2 [(ucupa.network.token_kind) = QUERY_CONTINUATION];
  optional uint32 limit = 3 [(ucupa.network.required_value) = true];
  FederationProjectionRequest request = 4 [(ucupa.network.required_value) = true];
  optional bytes read_challenge = 5;
  ucupa.network.IdentityProof read_proof = 6;
}
message BeginFederationReadAtChallengeRequest {
  ucupa.network.Token basis = 1 [(ucupa.network.required_value) = true, (ucupa.network.token_kind) = READ_RECEIPT];
  optional string element = 2 [(ucupa.network.required_value) = true];
  optional uint64 ttl_seconds = 3 [(ucupa.network.required_value) = true];
}
message ProjectFederationReadPartResponse { oneof outcome { FederationProjectionPage result = 1; ucupa.network.Failure failure = 2; } }
message FederationReadPartRequest { ucupa.network.Token basis = 1 [(ucupa.network.required_value) = true, (ucupa.network.token_kind) = READ_RECEIPT]; }
message CheckFederationReadPartRequest {
  ucupa.network.Token basis = 1 [(ucupa.network.required_value) = true, (ucupa.network.token_kind) = READ_RECEIPT];
  optional bool require_current = 2 [(ucupa.network.required_value) = true];
}
message FederationReadPartCheck { optional bool valid = 1 [(ucupa.network.required_value) = true]; }
message CheckFederationReadPartResponse { oneof outcome { FederationReadPartCheck result = 1; ucupa.network.Failure failure = 2; } }
message FederationReadPartRelease { optional bool released = 1 [(ucupa.network.required_value) = true]; }
message ReleaseFederationReadPartResponse { oneof outcome { FederationReadPartRelease result = 1; ucupa.network.Failure failure = 2; } }
message ObserveFederationReadPartRequest {
  ucupa.network.Token basis = 1 [(ucupa.network.required_value) = true, (ucupa.network.token_kind) = READ_RECEIPT];
  optional string operation = 2 [(ucupa.network.required_value) = true];
  ucupa.network.Token cursor = 3 [(ucupa.network.token_kind) = OBSERVATION_CURSOR];
  optional uint32 limit = 4;
}
message FederationObservationPage {
  ucupa.network.Token cursor = 1 [(ucupa.network.required_value) = true, (ucupa.network.token_kind) = OBSERVATION_CURSOR];
  repeated ChangeGroup groups = 2;
}
message ObserveFederationReadPartResponse { oneof outcome { FederationObservationPage result = 1; ucupa.network.Failure failure = 2; } }
service FederationReadService {
  rpc ObserveFederationReadPart(ObserveFederationReadPartRequest) returns (ObserveFederationReadPartResponse);
  rpc BeginFederationReadChallenge(BeginFederationReadChallengeRequest) returns (IdentityChallenge);
  rpc ExchangeFederationReadIdentity(ExchangeIdentityRequest) returns (ExchangeFederationReadIdentityResponse);
  rpc BeginFederationReadAtChallenge(BeginFederationReadAtChallengeRequest) returns (IdentityChallenge);
  rpc ProjectFederationReadPart(ProjectFederationReadPartRequest) returns (ProjectFederationReadPartResponse);
  rpc CheckFederationReadPart(CheckFederationReadPartRequest) returns (CheckFederationReadPartResponse);
  rpc ReleaseFederationReadPart(FederationReadPartRequest) returns (ReleaseFederationReadPartResponse);
}
