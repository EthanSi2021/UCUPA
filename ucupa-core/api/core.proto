  rpc ReleaseObserve(ReleaseObserveRequest) returns (ReleaseObserveResponse);
  rpc CreateAnchor(CreateAnchorRequest) returns (CreateAnchorResponse);
  rpc CreateEntity(CreateEntityRequest) returns (CreateEntityResponse);
  rpc UpdateAnchor(UpdateAnchorRequest) returns (UpdateAnchorResponse);
  rpc UpdateEntity(UpdateEntityRequest) returns (UpdateEntityResponse);
  rpc DeleteAnchor(DeleteAnchorRequest) returns (DeleteAnchorResponse);
  rpc DeleteEntity(DeleteEntityRequest) returns (DeleteEntityResponse);
  rpc RecoverOutcome(RecoverOutcomeRequest) returns (RecoverOutcomeResponse);
}

// Fixed-service attachment evidence. Never returned by consumer CoreService reads.
message ServiceRevision {
  optional bytes incarnation = 1 [(ucupa.network.required_value) = true];
  optional uint64 sequence = 2 [(ucupa.network.required_value) = true];
}
message ServiceCoreCut {
  optional bytes incarnation = 1 [(ucupa.network.required_value) = true];
  optional uint64 sequence = 2 [(ucupa.network.required_value) = true];
}
message ServiceAttachmentKey {
  optional string core = 1 [(ucupa.network.required_value) = true];
  optional string facet = 2 [(ucupa.network.required_value) = true];
  optional string element = 3 [(ucupa.network.required_value) = true];
  ServiceRevision proposal = 4 [(ucupa.network.required_value) = true];
}
message ReadControlRequest {
  ServiceAttachmentKey key = 1 [(ucupa.network.required_value) = true];
  optional bool prepare = 2 [(ucupa.network.required_value) = true];
}
message CheckControlRequest {
  ServiceAttachmentKey key = 1 [(ucupa.network.required_value) = true];
  ucupa.network.Token preparation = 2 [(ucupa.network.required_value) = true, (ucupa.network.token_kind) = OBSERVATION_PREPARATION];
}
message ControlRead {
  optional string core = 1 [(ucupa.network.required_value) = true];
  optional string element = 2 [(ucupa.network.required_value) = true];
  optional Presence presence = 3 [(ucupa.network.required_value) = true];
  ServiceCoreCut cut = 4 [(ucupa.network.required_value) = true];
  optional AttachmentState state = 5;
  ServiceRevision revision = 6;
  ServiceAttachmentKey active = 7;
  ucupa.network.Token proposal = 8 [(ucupa.network.token_kind) = ATTACHMENT_REVISION];
  ucupa.network.Token preparation = 9 [(ucupa.network.token_kind) = OBSERVATION_PREPARATION];
  ServiceAttachmentKey pending = 10;
}
message ReadControlResponse { oneof outcome { ControlRead result = 1; ucupa.network.Failure failure = 2; } }
message CheckControlResult { optional bool valid = 1 [(ucupa.network.required_value) = true]; }
message CheckControlResponse { oneof outcome { CheckControlResult result = 1; ucupa.network.Failure failure = 2; } }
service AttachmentControlService {
  rpc ReadControl(ReadControlRequest) returns (ReadControlResponse);
  rpc ReadProposalControl(ReadControlRequest) returns (ReadControlResponse);
  rpc CheckControl(CheckControlRequest) returns (CheckControlResponse);
  rpc ResolveProposalControl(ResolveProposalControlRequest) returns (ReadControlResponse);
  rpc ReadReplacementControl(ReadReplacementControlRequest) returns (ReadReplacementControlResponse);
  rpc ReadSuccessorControl(ReadSuccessorControlRequest) returns (ReadSuccessorControlResponse);
}
message ResolveProposalControlRequest {
  optional string element = 1 [(ucupa.network.required_value) = true];
  ucupa.network.Token proposal = 2 [(ucupa.network.required_value) = true, (ucupa.network.token_kind) = ATTACHMENT_REVISION];
}
// The fixed Facet service's trusted read of exactly one named replacement
// control record it is a party to. It never authorizes a public caller.
message ReadReplacementControlRequest {
  optional bytes operation_id = 1 [(ucupa.network.required_value) = true];
  optional string element = 2 [(ucupa.network.required_value) = true];
}
message ReplacementControlRecord {
  optional string element = 1 [(ucupa.network.required_value) = true];
  optional bytes operation_id = 2 [(ucupa.network.required_value) = true];
  optional string source = 3 [(ucupa.network.required_value) = true];
  optional string target = 4 [(ucupa.network.required_value) = true];
  ServiceRevision proposal = 5 [(ucupa.network.required_value) = true];
  optional uint64 final_cut = 6;
  optional bytes manifest_digest = 7;
  optional bool permitted = 8 [(ucupa.network.required_value) = true];
  optional bool fenced = 9 [(ucupa.network.required_value) = true];
  optional bool accepted = 10 [(ucupa.network.required_value) = true];
  optional bool committed = 11 [(ucupa.network.required_value) = true];
  optional bool settled = 12 [(ucupa.network.required_value) = true];
  optional bool cancelled = 13 [(ucupa.network.required_value) = true];
}
message ReadReplacementControlResponse { oneof outcome { ReplacementControlRecord result = 1; ucupa.network.Failure failure = 2; } }
// The fixed Facet service's trusted read of one previous Core's durable
// successor statement for a departed element. It never authorizes a public
// caller and discloses no manifest content.
message ReadSuccessorControlRequest {
  optional string element = 1 [(ucupa.network.required_value) = true];
}
message SuccessorControlRecord {
  optional string element = 1 [(ucupa.network.required_value) = true];
  optional bool found = 2 [(ucupa.network.required_value) = true];
  optional bytes operation_id = 3;
  optional string source = 4;
  optional string target = 5;
  optional uint64 final_cut = 6;
  optional bool settled = 7 [(ucupa.network.required_value) = true];
}
message ReadSuccessorControlResponse { oneof outcome { SuccessorControlRecord result = 1; ucupa.network.Failure failure = 2; } }

// Target-issued read-only authority, separate from the user's ordinary session.
// The actor must prove possession of its configured TLS client key on every connection.
message CreateReadDelegationRequest {
  ucupa.network.Reference reference = 1 [(ucupa.network.required_value) = true];
  optional string actor = 2 [(ucupa.network.required_value) = true];
  repeated Intent intents = 3;
  optional bool observe = 4 [(ucupa.network.required_value) = true];
  optional uint64 ttl_seconds = 5 [(ucupa.network.required_value) = true];
}
message ReadDelegation {
  optional string target = 1 [(ucupa.network.required_value) = true];
  optional string actor = 2 [(ucupa.network.required_value) = true];
  optional bytes token = 3 [(ucupa.network.required_value) = true];
  ucupa.network.Token handle = 4 [(ucupa.network.required_value) = true, (ucupa.network.token_kind) = SPACE_HANDLE];
  optional uint64 expires_in_seconds = 5 [(ucupa.network.required_value) = true];
}
message CreateReadDelegationResponse {
  oneof outcome { ReadDelegation result = 1; ucupa.network.Failure failure = 2; }
}
message RevokeReadDelegationRequest { optional bytes token = 1 [(ucupa.network.required_value) = true]; }
message RevokeReadDelegationResponse { optional bool released = 1 [(ucupa.network.required_value) = true]; }
service ReadDelegationService {
  rpc CreateReadDelegation(CreateReadDelegationRequest) returns (CreateReadDelegationResponse);
  rpc RevokeReadDelegation(RevokeReadDelegationRequest) returns (RevokeReadDelegationResponse);
  rpc BeginIdentityChallenge(CreateReadDelegationRequest) returns (IdentityChallenge);
  rpc ExchangeIdentity(ExchangeIdentityRequest) returns (CreateReadDelegationResponse);
}
message IdentityChallenge {
  optional bytes challenge = 1 [(ucupa.network.required_value) = true];
  optional uint64 expires_in_seconds = 2 [(ucupa.network.required_value) = true];
}
message ExchangeIdentityRequest {
  optional string actor = 1 [(ucupa.network.required_value) = true];
  optional bytes challenge = 2 [(ucupa.network.required_value) = true];
  ucupa.network.IdentityProof proof = 3 [(ucupa.network.required_value) = true];
}

// Exact command commitment, not a scope-wide write delegation. The target is
// the authenticated service; actor is the sole permitted forwarding Core.
message MountApprovalBinding {
  optional string actor = 1 [(ucupa.network.required_value) = true];
  optional string element = 2 [(ucupa.network.required_value) = true];
  optional bytes operation_id = 3 [(ucupa.network.required_value) = true];
  optional bytes command_digest = 4 [(ucupa.network.required_value) = true];
}
message CreateMountApprovalRequest {
  MountApprovalBinding binding = 1 [(ucupa.network.required_value) = true];
  optional uint64 ttl_seconds = 2 [(ucupa.network.required_value) = true];
}
message MountApproval {
  optional string target = 1 [(ucupa.network.required_value) = true];
  MountApprovalBinding binding = 2 [(ucupa.network.required_value) = true];
  optional bytes token = 3 [(ucupa.network.required_value) = true];
  optional uint64 expires_in_seconds = 4 [(ucupa.network.required_value) = true];
}
message CreateMountApprovalResponse { oneof outcome { MountApproval result = 1; ucupa.network.Failure failure = 2; } }
message CheckMountApprovalRequest {
  MountApprovalBinding binding = 1 [(ucupa.network.required_value) = true];
  optional bytes token = 2 [(ucupa.network.required_value) = true];
}
message MountApprovalCheck {
  optional string target = 1 [(ucupa.network.required_value) = true];
  optional string realm = 2 [(ucupa.network.required_value) = true];
  optional string principal = 3 [(ucupa.network.required_value) = true];
}
message CheckMountApprovalResponse { oneof outcome { MountApprovalCheck result = 1; ucupa.network.Failure failure = 2; } }
message RevokeMountApprovalRequest { optional bytes token = 1 [(ucupa.network.required_value) = true]; }
message RevokeMountApprovalResponse { optional bool released = 1 [(ucupa.network.required_value) = true]; }
service MountApprovalService {
  rpc CreateMountApproval(CreateMountApprovalRequest) returns (CreateMountApprovalResponse);
  rpc CheckMountApproval(CheckMountApprovalRequest) returns (CheckMountApprovalResponse);
  rpc RevokeMountApproval(RevokeMountApprovalRequest) returns (RevokeMountApprovalResponse);
}

// Peer evidence is never a public query token. Only mutually authenticated
// service calls may carry these messages; actor fields are attribution, not
// authentication. Sequence numbers retain their complete uint64 precision.
enum MountCommandKind { MOUNT_COMMAND_UNSPECIFIED = 0; MOUNT_ESTABLISH = 1; MOUNT_UPDATE = 2; MOUNT_REVOKE = 3; }
enum MountDecisionKind { MOUNT_DECISION_UNSPECIFIED = 0; MOUNT_PENDING = 1; MOUNT_COMMITTED = 2; MOUNT_ABORTED = 3; }
enum MountRejection { MOUNT_REJECTION_UNSPECIFIED = 0; MOUNT_NO_REJECTION = 1; MOUNT_DENIED = 2; MOUNT_NOT_FOUND = 3; MOUNT_CONFLICT = 4; MOUNT_REVISION_CONFLICT = 5; }
message ServicePrincipal {
  optional string realm = 1 [(ucupa.network.required_value) = true];
  optional string principal = 2 [(ucupa.network.required_value) = true];
}
message ServiceMountKey {
  optional string parent_core = 1 [(ucupa.network.required_value) = true];
  optional string carrier_core = 2 [(ucupa.network.required_value) = true];
  optional string element = 3 [(ucupa.network.required_value) = true];
  ServiceRevision proposal = 4 [(ucupa.network.required_value) = true];
}
message ServiceMountAdmission {
  ServiceMountKey key = 1 [(ucupa.network.required_value) = true];
  optional bytes operation_id = 2 [(ucupa.network.required_value) = true];
}
message ServiceMountCommand {
  optional MountCommandKind kind = 1 [(ucupa.network.required_value) = true];
  optional string element = 2 [(ucupa.network.required_value) = true];
  ServiceRevision expected_element = 3;
  ServiceRevision expected_mount = 4;
  optional string carrier_core = 5;
  optional string carrier_next_hop = 6;
  optional string parent_next_hop = 7;
  SpatialTuple final = 8;
}
message ServiceMountPrepare {
  ServiceMountKey key = 1 [(ucupa.network.required_value) = true];
  optional bytes operation_id = 2 [(ucupa.network.required_value) = true];
  ServiceMountCommand command = 3 [(ucupa.network.required_value) = true];
  ServicePrincipal parent_actor = 4 [(ucupa.network.required_value) = true];
  // Required for establish/update, absent when revoke needs no new B caller.
  ServicePrincipal carrier_actor = 5;
  ServiceMountAdmission previous = 6;
  ServiceRevision reserved = 7 [(ucupa.network.required_value) = true];
  SpatialTuple tuple = 8 [(ucupa.network.required_value) = true];
}
message ServiceMountPrepared {
  ServiceMountPrepare request = 1 [(ucupa.network.required_value) = true];
  optional bool prepared = 2 [(ucupa.network.required_value) = true];
  optional MountRejection rejection = 3 [(ucupa.network.required_value) = true];
  ServiceCoreCut cut = 4 [(ucupa.network.required_value) = true];
}
message ServiceMountDecision {
  ServiceMountPrepare request = 1 [(ucupa.network.required_value) = true];
  optional MountDecisionKind decision = 2 [(ucupa.network.required_value) = true];
  ServiceCoreCut cut = 3;
  optional MountRejection rejection = 4 [(ucupa.network.required_value) = true];
  ServiceMountAdmission admission = 5;
}
message ServiceMountClosed {
  ServiceMountDecision evidence = 1 [(ucupa.network.required_value) = true];
  ServiceCoreCut cut = 2 [(ucupa.network.required_value) = true];
}
message PrepareMountRequest {
  ServiceMountPrepare request = 1 [(ucupa.network.required_value) = true];
  CheckMountApprovalRequest approval = 2 [(ucupa.network.required_value) = true];
}
message PrepareMountResponse { oneof outcome { ServiceMountPrepared result = 1; ucupa.network.Failure failure = 2; } }
message FinishMountRequest { ServiceMountDecision evidence = 1 [(ucupa.network.required_value) = true]; }
message FinishMountResponse { oneof outcome { ServiceMountClosed result = 1; ucupa.network.Failure failure = 2; } }
message ReadMountDecisionRequest {
  optional string parent_core = 1 [(ucupa.network.required_value) = true];
  optional bytes operation_id = 2 [(ucupa.network.required_value) = true];
  optional string actor = 3 [(ucupa.network.required_value) = true];
}
message ReadMountDecisionResponse { oneof outcome { ServiceMountDecision result = 1; ucupa.network.Failure failure = 2; } }
service MountPeerService {
  rpc PrepareMount(PrepareMountRequest) returns (PrepareMountResponse);
  rpc FinishMount(FinishMountRequest) returns (FinishMountResponse);
  rpc ReadMountDecision(ReadMountDecisionRequest) returns (ReadMountDecisionResponse);
}

// Ordinary callers use opaque comparisons, never the peer evidence above.
message PublicMountCommand {
  optional MountCommandKind kind = 1 [(ucupa.network.required_value) = true];
  optional string element = 2 [(ucupa.network.required_value) = true];
  ucupa.network.Token expected_element = 3 [(ucupa.network.token_kind) = RECORD_REVISION];
  ucupa.network.Token expected_mount = 4 [(ucupa.network.token_kind) = MOUNT_REVISION];
  optional string carrier_core = 5;
  optional string carrier_next_hop = 6;
  optional string parent_next_hop = 7;
  SpatialTuple final = 8;
}
message InspectMountRequest { optional string element = 1 [(ucupa.network.required_value) = true]; }
message PublicMountInspection {
  optional string element = 1 [(ucupa.network.required_value) = true];
  ucupa.network.Token element_revision = 2 [(ucupa.network.required_value) = true, (ucupa.network.token_kind) = RECORD_REVISION];
  ucupa.network.Token mount_revision = 3 [(ucupa.network.token_kind) = MOUNT_REVISION];
  optional uint32 state = 4 [(ucupa.network.required_value) = true];
  optional string carrier_core = 5;
  optional string next_hop = 6;
}
message InspectMountResponse { oneof outcome { PublicMountInspection result = 1; ucupa.network.Failure failure = 2; } }
message DescribeMountRequest {
  optional bytes operation_id = 1 [(ucupa.network.required_value) = true];
  PublicMountCommand command = 2 [(ucupa.network.required_value) = true];
}
message MountApprovalDescription {
  optional bool required = 1 [(ucupa.network.required_value) = true];
  optional string target = 2;
  MountApprovalBinding binding = 3;
}
message DescribeMountResponse { oneof outcome { MountApprovalDescription result = 1; ucupa.network.Failure failure = 2; } }
message ApplyMountRequest {
  optional bytes operation_id = 1 [(ucupa.network.required_value) = true];
  PublicMountCommand command = 2 [(ucupa.network.required_value) = true];
  MountApproval approval = 3;
}
message PublicMountOutcome {
  optional bytes operation_id = 1 [(ucupa.network.required_value) = true];
  optional string element = 2 [(ucupa.network.required_value) = true];
  optional MountDecisionKind decision = 3 [(ucupa.network.required_value) = true];
  optional bool settled = 4 [(ucupa.network.required_value) = true];
  optional bool changed = 5 [(ucupa.network.required_value) = true];
  optional MountRejection rejection = 6 [(ucupa.network.required_value) = true];
  optional uint32 blocked_by = 7 [(ucupa.network.required_value) = true];
}
message ApplyMountResponse { oneof outcome { PublicMountOutcome result = 1; ucupa.network.Failure failure = 2; } }
service MountControlService {
  rpc InspectMount(InspectMountRequest) returns (InspectMountResponse);
  rpc DescribeMount(DescribeMountRequest) returns (DescribeMountResponse);
  rpc ApplyMount(ApplyMountRequest) returns (ApplyMountResponse);
}

message InspectMountContactRequest {
  optional string element = 1 [(ucupa.network.required_value) = true];
  optional bool incoming = 2 [(ucupa.network.required_value) = true];
}
message PublicMountContact {
  optional string element = 1 [(ucupa.network.required_value) = true];
  optional bool incoming = 2 [(ucupa.network.required_value) = true];
  optional string peer_core = 3 [(ucupa.network.required_value) = true];
  optional string next_hop = 4 [(ucupa.network.required_value) = true];
  ucupa.network.Token revision = 5 [(ucupa.network.required_value) = true, (ucupa.network.token_kind) = CONTACT_REVISION];
}
message InspectMountContactResponse { oneof outcome { PublicMountContact result = 1; ucupa.network.Failure failure = 2; } }
message RepairMountContactRequest {
  optional bytes operation_id = 1 [(ucupa.network.required_value) = true];
  optional string element = 2 [(ucupa.network.required_value) = true];
  optional bool incoming = 3 [(ucupa.network.required_value) = true];
  ucupa.network.Token expected = 4 [(ucupa.network.required_value) = true, (ucupa.network.token_kind) = CONTACT_REVISION];
  optional string next_hop = 5 [(ucupa.network.required_value) = true];
}
message RepairMountContactResponse { oneof outcome { PublicMountContact result = 1; ucupa.network.Failure failure = 2; } }
service MountContactService {
