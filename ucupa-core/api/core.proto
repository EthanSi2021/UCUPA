  optional Coverage status = 4 [(ucupa.network.required_value) = true];
  ucupa.network.Token continuation = 5 [(ucupa.network.token_kind) = QUERY_CONTINUATION]; ucupa.network.Token preparation = 6 [(ucupa.network.token_kind) = OBSERVATION_PREPARATION];
  optional bytes closure = 7;
  PublicSourceGraph source_graph = 8;
}
message QueryRegionResult {
  ucupa.network.Token receipt = 1 [(ucupa.network.required_value) = true, (ucupa.network.token_kind) = READ_RECEIPT];
  optional ReadMode read_mode = 2 [(ucupa.network.required_value) = true];
  repeated Match matches = 3;
  optional string scope = 4 [(ucupa.network.required_value) = true];
